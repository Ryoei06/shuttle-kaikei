<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シャトル会計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --ground:#f5f7f4;
  --surface:#ffffff;
  --surface-2:#eef2ee;
  --ink:#16211d;
  --muted:#5c6b64;
  --faint:#8a978f;
  --border:#e0e6e0;
  --border-strong:#cdd6ce;
  --accent:#0f766e;
  --accent-ink:#0b5952;
  --accent-soft:#d8ebe8;
  --income:#15803d;
  --income-soft:#e3f3e8;
  --expense:#c02626;
  --expense-soft:#fbe4e4;
  --warn:#b3690a;
  --warn-soft:#fbeed6;
  --shadow:0 1px 2px rgba(20,40,34,.06), 0 4px 16px rgba(20,40,34,.05);
  --shadow-lg:0 8px 40px rgba(15,60,54,.16);
  --r:14px;
  --r-sm:9px;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  --round:"Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0e1513;
    --surface:#161f1c;
    --surface-2:#1d2823;
    --ink:#e7edea;
    --muted:#9aa8a1;
    --faint:#6f7d76;
    --border:#26322d;
    --border-strong:#31403a;
    --accent:#2dd4bf;
    --accent-ink:#5fe6d4;
    --accent-soft:#123832;
    --income:#4ade80;
    --income-soft:#12321f;
    --expense:#f87171;
    --expense-soft:#361818;
    --warn:#e0a44a;
    --warn-soft:#33260f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.28);
    --shadow-lg:0 10px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0e1513;
  --surface:#161f1c;
  --surface-2:#1d2823;
  --ink:#e7edea;
  --muted:#9aa8a1;
  --faint:#6f7d76;
  --border:#26322d;
  --border-strong:#31403a;
  --accent:#2dd4bf;
  --accent-ink:#5fe6d4;
  --accent-soft:#123832;
  --income:#4ade80;
  --income-soft:#12321f;
  --expense:#f87171;
  --expense-soft:#361818;
  --warn:#e0a44a;
  --warn-soft:#33260f;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.28);
  --shadow-lg:0 10px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--round);font-weight:700;text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-ink)}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--border);
}
.hbar{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-ink));
  display:grid;place-items:center;font-size:19px;box-shadow:var(--shadow);
}
.brand .name{font-family:var(--round);font-weight:700;font-size:1.02rem;line-height:1.15}
.brand .club{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.balchip{
  display:flex;flex-direction:column;align-items:flex-end;
  padding:6px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
}
.balchip .lab{font-size:.66rem;letter-spacing:.08em;color:var(--muted)}
.balchip .val{font-family:var(--round);font-weight:700;font-size:1.15rem;line-height:1.1}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)
}
.iconbtn:hover{color:var(--ink);border-color:var(--border-strong)}

/* ---- nav ---- */
nav{margin-top:18px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav::-webkit-scrollbar{display:none}
.tab{
  border:none;background:transparent;color:var(--muted);
  padding:9px 15px;border-radius:10px;font-size:.9rem;font-weight:500;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:background .12s,color .12s;
}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{color:#fff;background:var(--accent)}
:root[data-theme="dark"] .tab[aria-current="page"],
:root:not([data-theme="light"]) .tab[aria-current="page"]{color:#04211d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-current="page"]{color:#04211d}}
.tab .badge{font-size:.68rem;background:var(--warn);color:#fff;border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}

/* ---- sample banner ---- */
.sample-banner{
  margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--ink);padding:11px 15px;border-radius:12px;font-size:.85rem;
}
.sample-banner b{color:var(--warn)}
.sample-banner button{margin-left:auto}

/* ---- generic ---- */
.view{margin-top:22px;display:flex;flex-direction:column;gap:18px}
.section-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:1.22rem}
.section-head .sub{color:var(--muted);font-size:.85rem}
.section-head .spacer{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}

.btn{
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:10px;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;
}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#04211d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#04211d}}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--surface);color:var(--expense);border-color:color-mix(in srgb,var(--expense) 45%,transparent)}
.btn.danger:hover{background:var(--expense-soft)}
.btn.sm{padding:6px 12px;font-size:.8rem;font-weight:500}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.kpi{padding:18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
.kpi .lab{font-size:.75rem;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .big{font-family:var(--round);font-weight:700;font-size:2.1rem;line-height:1.15;margin-top:6px}
.kpi.hero{
  grid-column:span 1;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 60%),
    var(--surface);
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
}
.kpi.hero .big{font-size:2.5rem;color:var(--accent-ink)}
.kpi .foot{font-size:.76rem;color:var(--muted);margin-top:8px}
.pos{color:var(--income)}
.neg{color:var(--expense)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* ---- list rows ---- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.row .main{min-width:0;flex:1}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.78rem;color:var(--muted)}
.row .amt{font-family:var(--round);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mark{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:15px}
.mark.in{background:var(--income-soft);color:var(--income)}
.mark.out{background:var(--expense-soft);color:var(--expense)}
.mark.join{background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:.9rem}
.empty .em{font-size:26px;display:block;margin-bottom:8px;opacity:.7}

.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
button.pill{border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
button.pill:hover{outline:2px solid color-mix(in srgb,currentColor 30%,transparent);outline-offset:1px}
button.pill:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pill.ok{background:var(--income-soft);color:var(--income)}
.pill.due{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--surface-2);color:var(--muted)}

/* ---- forms / dialog ---- */
dialog{
  border:none;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-lg);max-width:520px;width:calc(100% - 32px);
}
dialog::backdrop{background:rgba(10,20,17,.5);backdrop-filter:blur(2px)}
.dlg-head{padding:18px 20px 4px;display:flex;align-items:center}
.dlg-head h3{font-size:1.15rem}
.dlg-body{padding:8px 20px 4px;display:flex;flex-direction:column;gap:14px;max-height:66vh;overflow:auto}
.dlg-foot{padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:500;color:var(--muted)}
.field .hint{font-size:.72rem;color:var(--faint)}
input,select,textarea{
  font-family:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.field.row2{flex-direction:row;gap:10px}
.field.row2>div{flex:1;display:flex;flex-direction:column;gap:5px}
.check{display:flex;align-items:center;gap:9px}
.check input{width:auto}
.att-list{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.att{display:flex;align-items:center;gap:8px 12px;padding:10px 12px;border-top:1px solid var(--border);flex-wrap:wrap}
.att:first-child{border-top:none}
.att .nm{flex:1;font-weight:500;min-width:64px}
.att label{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.att input[type=checkbox]{width:auto}
.att .adv{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.82rem;color:var(--muted)}
.att .adv input[type=number]{width:84px;padding:6px 8px}
.att.on{background:var(--accent-soft)}
.att-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--faint);padding:0 2px 4px}
.calc-note{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.calc-note b{color:var(--income);font-family:var(--round)}

/* ---- report ---- */
.brk{display:flex;flex-direction:column}
.brk .row{justify-content:space-between}
table.rep{width:100%;border-collapse:collapse;font-size:.9rem}
table.rep th,table.rep td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
table.rep td.n,table.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
table.rep tfoot td{font-weight:700;border-top:2px solid var(--border-strong);border-bottom:none}

/* ---- chart ---- */
.chart-wrap{overflow-x:auto}
.leg{display:flex;gap:16px;font-size:.78rem;color:var(--muted);margin-top:4px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi4 .kpi .big{font-size:1.55rem}
@media(max-width:640px){.kpi4{grid-template-columns:1fr 1fr}}

.copybox{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;min-height:120px;white-space:pre}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);padding:7px 13px;font-size:.83rem;border-left:1px solid var(--border)}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#04211d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#04211d}}

@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hero{grid-column:1 / -1}
  .two{grid-template-columns:1fr}
}

/* ---- print ---- */
@media print{
  header,nav,.sample-banner,.no-print,.tab{display:none !important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #bbb}
  .view{margin-top:0}
  .wrap{padding:0}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="brand">
      <div class="logo">🏸</div>
      <div style="min-width:0">
        <div class="name">シャトル会計</div>
        <div class="club" id="clubName">バドミントンサークル</div>
      </div>
    </div>
    <div class="balchip">
      <span class="lab">現在の残高</span>
      <span class="val tnum" id="hbal">¥0</span>
    </div>
    <button class="iconbtn" id="themeBtn" title="表示テーマ切替" aria-label="テーマ切替">◐</button>
  </div>
  <div class="wrap" style="padding-block:0 12px">
    <nav id="nav" aria-label="メインナビ"></nav>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <div id="view" class="view"></div>
</main>

<!-- dialogs are injected/created on the fly -->

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY="shuttle-kaikei-v2";
/* ===== Firebase 設定（ここに貼り付け）=====
   Firebaseコンソールの「プロジェクトの設定 → マイアプリ（ウェブ）」の firebaseConfig を貼り付け */
const firebaseConfig = {
  apiKey: "AIzaSyCSi_0hQ6o5gxlvYeQE2-KDGntDzR4IsdU",
  authDomain: "accountapp-41d2c.firebaseapp.com",
  databaseURL: "https://accountapp-41d2c-default-rtdb.firebaseio.com",
  projectId: "accountapp-41d2c",
  storageBucket: "accountapp-41d2c.firebasestorage.app",
  messagingSenderId: "88596569789",
  appId: "1:88596569789:web:3e52fe4c03ed1daa92a1d4",
  measurementId: "G-0EP8RZ01JZ"
};
let fref=null, remote=false, fseeded=false;
const uid=()=>Math.random().toString(36).slice(2,9);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const fmtDate=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${+m}/${+d}`};
const fmtDateFull=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${y}年${+m}月${+d}日`};
const EXP_CATS=["コート代","シャトル代","備品","飲食","交通費","その他"];
const INC_CATS=["イベント収入","寄付","助成金","物品販売","その他"];
const isIncome=e=>e.kind==="in";          // 支出タブ内の「収入」項目
const outEntries=()=>state.expenses.filter(e=>!isIncome(e));
const inEntries=()=>state.expenses.filter(e=>isIncome(e));
const VENUES=["池田総合スポーツセンター","豊島体育館","柴原体育館","庄内体育館"];
const COLLECTORS=["こうき","こうせい","はるか","りょうえい","かずや","ゆうと","そらと","なおひろ","みづき","ゆみか","なつき","あづ"];
const SLOTS=["13:00~17:00","16:30~18:30","18:00~21:00"];

/* ---------- state ---------- */
function seed(){
  const t=new Date();
  const ymd=off=>{const d=new Date(t);d.setDate(d.getDate()-off);return d.toISOString().slice(0,10)};
  const s=[
    {id:"s1",date:ymd(21),venue:"池田総合スポーツセンター",fee:500,count:5,newMembers:5,entryFee:1500,collector:"こうき",remitted:true,slot:"18:00~21:00"},
    {id:"s2",date:ymd(14),venue:"豊島体育館",fee:500,count:5,newMembers:0,entryFee:1500,collector:"こうせい",remitted:true,slot:"13:00~17:00"},
    {id:"s3",date:ymd(6),venue:"柴原体育館",fee:500,count:6,newMembers:2,entryFee:1500,collector:"りょうえい",remitted:false,slot:"18:00~21:00"},
    {id:"s4",date:ymd(35),venue:"休暇村 能勢（合宿）",fee:0,count:10,newMembers:0,entryFee:1500,collector:"こうき",remitted:true,slot:"",extraLabel:"夏合宿 合宿費",extra:30000},
  ];
  const e=[
    {id:"e1",date:ymd(21),category:"コート代",amount:2400,note:"2時間",advancedBy:"こうき",reimbursed:true,venue:"池田総合スポーツセンター",slot:"18:00~21:00"},
    {id:"e2",date:ymd(14),category:"コート代",amount:2400,note:"2時間",advancedBy:"こうせい",reimbursed:true,venue:"豊島体育館",slot:"13:00~17:00"},
    {id:"e3",date:ymd(6),category:"コート代",amount:3000,note:"2時間",advancedBy:"りょうえい",reimbursed:false,venue:"柴原体育館",slot:"18:00~21:00"},
    {id:"e4",date:ymd(6),category:"シャトル代",amount:3200,note:"1ダース",advancedBy:"",reimbursed:false,venue:"",slot:""},
    {id:"e5",date:ymd(28),category:"イベント収入",amount:12000,note:"夏祭り 出店売上",kind:"in"},
    {id:"e6",date:ymd(40),category:"寄付",amount:5000,note:"OBより",kind:"in"},
  ];
  return {settings:{clubName:"バドミントンサークル",carryover:5000,entryFee:1500,sessionFee:500},
    sessions:s,expenses:e,_sample:true};
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}
  return null;
}
let state=load()||seed();
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function save(){
  localSave();
  if(remote&&fref){fref.set({json:JSON.stringify(state),updated:Date.now()}).catch(e=>console.warn('保存エラー:',e.message||e));}
}
function initFirebase(){
  if(!firebaseConfig.databaseURL||!window.firebase)return; // 未設定ならこの端末内保存のみ
  try{firebase.initializeApp(firebaseConfig);fref=firebase.database().ref('shuttleKaikei');remote=true;}
  catch(e){console.warn(e);return;}
  fref.on('value',snap=>{
    const v=snap.val();
    if(v&&v.json){try{state=JSON.parse(v.json);localSave();refreshChrome();render();}catch(e){console.warn(e);}}
    else if(!fseeded){fseeded=true;fref.set({json:JSON.stringify(state),updated:Date.now()}).catch(e=>console.warn(e));}
  },err=>console.warn('同期エラー:',err.message||err));
}

/* ---------- computations ---------- */
const sessionCount=s=>s.count||0;
const sessionIncome=s=>sessionCount(s)*s.fee;
const sessionNew=s=>s.newMembers||0;
const sessionEntry=s=>sessionNew(s)*(s.entryFee||state.settings.entryFee);
const sessionExtra=s=>Math.max(0,s.extra||0);
const entryIncomeTotal=()=>state.sessions.reduce((a,s)=>a+sessionEntry(s),0);
const newMemberTotal=()=>state.sessions.reduce((a,s)=>a+sessionNew(s),0);
const feeIncomeTotal=()=>state.sessions.reduce((a,s)=>a+sessionIncome(s),0);
const extraIncomeTotal=()=>state.sessions.reduce((a,s)=>a+sessionExtra(s),0);
const expenseTotal=()=>outEntries().reduce((a,e)=>a+e.amount,0);
const otherIncomeTotal=()=>inEntries().reduce((a,e)=>a+e.amount,0);
const balance=()=>state.settings.carryover+entryIncomeTotal()+feeIncomeTotal()+extraIncomeTotal()+otherIncomeTotal()-expenseTotal();
function advanceList(){
  const map={};
  state.expenses.filter(e=>!isIncome(e)&&e.advancedBy&&!e.reimbursed).forEach(e=>{
    const k=e.advancedBy;map[k]=map[k]||{name:k,n:0,amt:0};map[k].n++;map[k].amt+=e.amount;});
  return Object.values(map).sort((a,b)=>b.amt-a.amt);
}
const advanceCount=()=>state.expenses.filter(e=>!isIncome(e)&&e.advancedBy&&!e.reimbursed).length;
const advanceTotal=()=>state.expenses.filter(e=>!isIncome(e)&&e.advancedBy&&!e.reimbursed).reduce((a,e)=>a+e.amount,0);
const sessionTotal=s=>sessionIncome(s)+sessionEntry(s)+sessionExtra(s);
function remitList(){
  const map={};
  state.sessions.filter(s=>!s.remitted&&sessionTotal(s)>0).forEach(s=>{
    const k=s.collector||"（集金担当 未設定）";
    map[k]=map[k]||{name:k,n:0,amt:0};map[k].n++;map[k].amt+=sessionTotal(s);});
  return Object.values(map).sort((a,b)=>b.amt-a.amt);
}
const remitCount=()=>state.sessions.filter(s=>!s.remitted&&sessionTotal(s)>0).length;
const remitTotal=()=>state.sessions.filter(s=>!s.remitted&&sessionTotal(s)>0).reduce((a,s)=>a+sessionTotal(s),0);
function transactions(){
  const t=[];
  state.sessions.forEach(s=>{const ne=sessionEntry(s);if(ne)t.push({date:s.date,kind:"入会金",label:(s.venue||"活動")+" 新規入会("+sessionNew(s)+"名)",amount:ne});});
  state.sessions.forEach(s=>{const p=sessionCount(s);if(p&&s.fee)t.push({date:s.date,kind:"参加費",label:(s.venue||"活動")+" 参加費("+p+"名)",amount:p*s.fee});});
  state.sessions.forEach(s=>{const x=sessionExtra(s);if(x)t.push({date:s.date,kind:"特別収入",label:(s.extraLabel?s.extraLabel:(s.venue||"活動")+" 特別収入"),amount:x});});
  state.expenses.forEach(e=>{
    if(isIncome(e))t.push({date:e.date,kind:"その他収入",label:e.category+(e.note?" / "+e.note:""),amount:e.amount});
    else t.push({date:e.date,kind:"支出",label:e.category+(e.note?" / "+e.note:""),amount:-e.amount});
  });
  return t.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
const inRange=(d,r)=>{const now=new Date();if(r==="all")return true;if(r==="year")return d.slice(0,4)===String(now.getFullYear());if(r==="month")return d.slice(0,7)===now.toISOString().slice(0,7);return true;};

function monthlyChart(r){
  // last up to 6 months buckets
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  const inc={},exp={};months.forEach(m=>{inc[m]=0;exp[m]=0;});
  state.sessions.forEach(s=>{const k=s.date.slice(0,7);if(k in inc)inc[k]+=sessionTotal(s);});
  state.expenses.forEach(e=>{const k=e.date.slice(0,7);if(k in exp){if(isIncome(e))inc[k]+=e.amount;else exp[k]+=e.amount;}});
  const max=Math.max(1,...months.map(m=>Math.max(inc[m],exp[m])));
  const W=Math.max(340,months.length*92),H=180,padB=34,padT=10,padL=44,plot=H-padB-padT,gw=(W-padL-10)/months.length;
  const y=val=>padT+plot-(val/max)*plot;
  const ticks=[0,max/2,max];
  let g="";
  ticks.forEach(t=>{const yy=y(t);g+=`<line x1="${padL}" y1="${yy}" x2="${W-6}" y2="${yy}" style="stroke:var(--border);stroke-width:1"/>
    <text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" style="fill:var(--faint)">${Math.round(t/1000)}k</text>`;});
  months.forEach((m,i)=>{
    const cx=padL+gw*i+gw/2;const bw=Math.min(20,gw/3);
    const yi=y(inc[m]),ye=y(exp[m]);
    g+=`<rect x="${cx-bw-1}" y="${yi}" width="${bw}" height="${padT+plot-yi}" rx="2" style="fill:var(--income)"/>`;
    g+=`<rect x="${cx+1}" y="${ye}" width="${bw}" height="${padT+plot-ye}" rx="2" style="fill:var(--expense)"/>`;
    g+=`<text x="${cx}" y="${H-14}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${+m.slice(5)}月</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:var(--sans)" role="img" aria-label="月別収支グラフ">${g}</svg>`;
}

function signedBarSVG(data){

    <h3 style="font-size:1rem;margin-bottom:4px">会場別の収支</h3>
    <div style="overflow-x:auto"><table class="rep">
      <thead><tr><th>会場</th><th class="n">回数</th><th class="n">平均参加</th><th class="n">参加費収入</th><th class="n">支出</th><th class="n">利益</th></tr></thead>
      <tbody>${venues.map(r=>`<tr>
        <td>${esc(r.venue)}</td><td class="n">${r.n}</td><td class="n">${r.n?num(r.avg):"–"}</td>
        <td class="n pos">${yen(r.rev)}</td><td class="n neg">${yen(r.exp)}</td>
        <td class="n ${r.profit<0?"neg":"pos"}">${r.profit<0?"−":""}${yen(Math.abs(r.profit))}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td>合計</td><td class="n">${nS}</td><td class="n">${nS?num(totalPart/nS):"–"}</td><td class="n">${yen(totRev)}</td><td class="n">${yen(totExp)}</td><td class="n ${totRev-totExp<0?"neg":"pos"}">${totRev-totExp<0?"−":""}${yen(Math.abs(totRev-totExp))}</td></tr></tfoot>
    </table></div>
    <p style="color:var(--faint);font-size:.72rem;margin-top:10px">※ 参加費収入＝参加人数×参加費。支出は同じ日の活動の会場に振り分け（活動日以外の支出は「その他」）。</p>
  </div>

  <div class="two">
    <div class="card pad">
      <h3 style="font-size:1rem;margin-bottom:10px">参加者の推移</h3>
      ${barChartSVG(partTrend)}
    </div>
    <div class="card pad">
      <h3 style="font-size:1rem;margin-bottom:4px">月次の利益推移</h3>
      <div style="font-size:.76rem;color:var(--muted);margin-bottom:8px">各月の収入（参加費＋入会金）− 支出</div>
      ${signedBarSVG(monData)}
    </div>
  </div>

  <div class="two">
    <div class="card pad">
      <h3 style="font-size:1rem;margin-bottom:4px">曜日別の参加傾向</h3>
      <div style="font-size:.76rem;color:var(--muted);margin-bottom:8px">曜日ごとの平均参加人数</div>
      ${barChartSVG(wdData)}
    </div>
    <div class="card pad">
      <h3 style="font-size:1rem;margin-bottom:4px">時間帯別の参加傾向</h3>
      <div style="font-size:.76rem;color:var(--muted);margin-bottom:8px">時間帯ごとの平均参加人数</div>
      ${slotData.length?barChartSVG(slotData):`<div class="empty" style="padding:22px">活動記録に時間帯を入力すると表示されます</div>`}
    </div>
  </div>

  <div class="card pad">
    <h3 style="font-size:1rem;margin-bottom:8px">1回・1人あたりの採算</h3>
    <div class="calc-note">参加費 <b>${yen(fee)}</b> に対して、実コストは1人あたり <b>${yen(perHead)}</b>。
      ${fee-perHead>=0?`<span class="pos">1人あたり ${yen(fee-perHead)} の黒字</span>で、参加費だけで運営費をまかなえています。`:`<span class="neg">1人あたり ${yen(perHead-fee)} の赤字</span>で、不足分は入会金や繰越金でまかなっている状態です。`}</div>
    <p style="color:var(--faint);font-size:.72rem;margin-top:10px">※ 実コスト＝支出合計 ${yen(exp)} ÷ 延べ参加 ${totalPart}名。参加費の見直しの目安に。</p>
  </div>`;
}

/* ===== Settings ===== */
function viewSettings(v){
  const s=state.settings;
  v.innerHTML=`
  <div class="section-head"><h2>設定</h2></div>
  <div class="card pad" style="display:flex;flex-direction:column;gap:16px">
    <h3 style="font-size:1rem">基本設定</h3>
    <div class="field"><label for="st-club">サークル名</label><input type="text" id="st-club" value="${esc(s.clubName)}"></div>
    <div class="field row2">
      <div><label for="st-carry">繰越金（開始残高）</label><input type="number" id="st-carry" step="100" value="${s.carryover}"></div>
      <div><label for="st-entry">入会金</label><input type="number" id="st-entry" step="100" value="${s.entryFee}"></div>
    </div>
    <div class="field"><label for="st-fee">参加費（1回・1名）</label><input type="number" id="st-fee" step="50" value="${s.sessionFee}"></div>
    <div><button class="btn" id="st-save">設定を保存</button> <span id="st-msg" style="color:var(--income);font-size:.82rem;margin-left:8px"></span></div>
    <p style="color:var(--faint);font-size:.72rem;margin:0">※ 入会金・参加費を変えても、これまでに記録した金額はそのまま残ります（変更後の記録に反映されます）。</p>
  </div>

  <div class="card pad" style="display:flex;flex-direction:column;gap:14px">
    <h3 style="font-size:1rem">データのバックアップ・引き継ぎ</h3>
    <p style="color:var(--muted);font-size:.85rem;margin:0">データはこの端末のブラウザ内に保存されます。機種変更や次期会計への引き継ぎのときは、下のテキストをコピーして保管し、新しい端末に貼り付けて読み込んでください。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost sm" id="exp">📋 バックアップを表示</button>
      <button class="btn ghost sm" id="imp">📥 バックアップから読み込み</button>
    </div>
    <div id="io"></div>
  </div>

  <div class="card pad" style="display:flex;flex-direction:column;gap:12px">
    <h3 style="font-size:1rem">初期化</h3>
    <p style="color:var(--muted);font-size:.85rem;margin:0">すべての会員・活動・支出の記録を消します（設定は残ります）。この操作は取り消せません。</p>
    <div><button class="btn danger sm" id="wipe">すべての記録を消す</button></div>
  </div>`;

  $("#st-save").onclick=()=>{
    s.clubName=$("#st-club").value.trim()||"バドミントンサークル";
    s.carryover=parseInt($("#st-carry").value)||0;
    s.entryFee=Math.max(0,parseInt($("#st-entry").value)||0);
    s.sessionFee=Math.max(0,parseInt($("#st-fee").value)||0);
    save();refreshChrome();$("#st-msg").textContent="保存しました ✓";setTimeout(()=>{if($("#st-msg"))$("#st-msg").textContent="";},1800);
  };
  $("#exp").onclick=()=>{
    $("#io").innerHTML=`<div class="field"><label>バックアップデータ（全選択してコピー）</label>
      <textarea class="copybox" id="expbox" readonly></textarea>
      <button class="btn sm" id="copybtn" style="align-self:flex-start;margin-top:6px">クリップボードにコピー</button></div>`;
    const box=$("#expbox");box.value=JSON.stringify(state);box.focus();box.select();
    $("#copybtn").onclick=()=>{box.select();try{navigator.clipboard.writeText(box.value);}catch(e){document.execCommand("copy");}
      $("#copybtn").textContent="コピーしました ✓";setTimeout(()=>{if($("#copybtn"))$("#copybtn").textContent="クリップボードにコピー";},1800);};
  };
  $("#imp").onclick=()=>{
    $("#io").innerHTML=`<div class="field"><label>バックアップデータを貼り付け</label>
      <textarea class="copybox" id="impbox" placeholder="ここにバックアップのテキストを貼り付け"></textarea>
      <button class="btn sm" id="impbtn" style="align-self:flex-start;margin-top:6px">このデータを読み込む</button>
      <span class="hint" id="imperr"></span></div>`;
    $("#impbtn").onclick=()=>{
      try{const d=JSON.parse($("#impbox").value);
        if(!d||!d.settings||!Array.isArray(d.sessions))throw 0;
        if(!confirm("現在の記録を、貼り付けたデータで上書きします。よろしいですか？"))return;
        state=d;save();refreshChrome();go("dash");
      }catch(e){$("#imperr").textContent="読み込めませんでした。テキストが正しいかご確認ください。";$("#imperr").style.color="var(--expense)";}
    };
  };
  $("#wipe").onclick=()=>{if(confirm("すべての会員・活動・支出の記録を消します。よろしいですか？")){
    state={settings:JSON.parse(JSON.stringify(state.settings)),sessions:[],expenses:[],_sample:false};
    save();refreshChrome();go("dash");}};
}

/* ---------- helpers ---------- */
function makeDialog(){
  const d=document.createElement("dialog");
  d.addEventListener("close",()=>d.remove());
  document.body.appendChild(d);
  return d;
}
function commit(){state._sample=false;save();refreshChrome();render();}
function showCSV(){
  const rows=[["日付","種別","内容","収入","支出"]];
  transactions().slice().reverse().forEach(t=>rows.push([t.date,t.kind,t.label.replace(/,/g,"、"),t.amount>0?t.amount:"",t.amount<0?-t.amount:""]));
  const csv=rows.map(r=>r.join(",")).join("\n");
  const dlg=makeDialog();
  dlg.innerHTML=`<div class="dlg-head"><h3>CSVデータ</h3></div>
    <div class="dlg-body"><p style="color:var(--muted);font-size:.84rem;margin:0">全選択してコピーし、ExcelやスプレッドシートにCSVとして貼り付けてください。</p>
    <textarea class="copybox" id="csvbox" readonly></textarea></div>
    <div class="dlg-foot"><button class="btn ghost" id="c-close">閉じる</button><button class="btn" id="c-copy">コピー</button></div>`;
  dlg.showModal();const box=$("#csvbox",dlg);box.value=csv;box.select();
  $("#c-close",dlg).onclick=()=>dlg.close();
  $("#c-copy",dlg).onclick=()=>{box.select();try{navigator.clipboard.writeText(csv);}catch(e){document.execCommand("copy");}$("#c-copy",dlg).textContent="コピー✓";};
}

/* ---------- theme ---------- */
(function theme(){
  let t=null;try{t=localStorage.getItem("shuttle-theme");}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  $("#themeBtn").onclick=()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    const next=isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("shuttle-theme",next);}catch(e){}
  };
})();

/* ---------- boot ---------- */
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)go(b.dataset.tab);});
renderNav();render();
initFirebase();
</script>
</body>
</html>
